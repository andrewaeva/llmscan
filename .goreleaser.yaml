# GoReleaser configuration for llmscan.
# Docs: https://goreleaser.com
version: 2

project_name: llmscan

before:
  hooks:
    - go mod tidy

builds:
  - id: llmscan
    main: ./cmd/llmscan
    binary: llmscan
    # tree-sitter grammars are cgo, so every target needs CGO_ENABLED=1 plus a
    # matching cross C compiler. The release workflow runs inside the
    # goreleaser-cross image, which bundles the linux/darwin/windows toolchains
    # referenced by the per-target CC overrides below.
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
      - goos: windows
        goarch: amd64
        env:
          - CC=x86_64-w64-mingw32-gcc

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - NOTICE.md
      - skills/**/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^docs\\("
      - "^test:"
      - "^test\\("
      - "^chore:"
      - "^chore\\("
      - "Merge pull request"
      - "Merge branch"

dockers:
  - id: llmscan-amd64
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/andrewaeva/llmscan:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/andrewaeva/llmscan"
      - "--label=org.opencontainers.image.description=LLM-based multi-agent code security scanner"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: llmscan-arm64
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/andrewaeva/llmscan:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/andrewaeva/llmscan"
      - "--label=org.opencontainers.image.description=LLM-based multi-agent code security scanner"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/andrewaeva/llmscan:{{ .Version }}"
    image_templates:
      - "ghcr.io/andrewaeva/llmscan:{{ .Version }}-amd64"
      - "ghcr.io/andrewaeva/llmscan:{{ .Version }}-arm64"
  - name_template: "ghcr.io/andrewaeva/llmscan:latest"
    image_templates:
      - "ghcr.io/andrewaeva/llmscan:{{ .Version }}-amd64"
      - "ghcr.io/andrewaeva/llmscan:{{ .Version }}-arm64"

release:
  github:
    owner: andrewaeva
    name: llmscan
  draft: false
  prerelease: auto
